name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.1.3"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Verify release version
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const version = process.env.RELEASE_VERSION;
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));

          const mismatches = [];
          if (packageJson.version !== version) {
            mismatches.push(`package.json version is ${packageJson.version}`);
          }
          if (manifest.version !== version) {
            mismatches.push(`manifest.json version is ${manifest.version}`);
          }

          if (mismatches.length > 0) {
            console.error(`Release tag/input is ${version}, but ${mismatches.join(" and ")}.`);
            process.exit(1);
          }
          NODE
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify release assets
        shell: bash
        run: |
          test -f manifest.json
          test -f main.js
          test -f styles.css

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            manifest.json
            main.js
            styles.css

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            manifest.json
            main.js
            styles.css
